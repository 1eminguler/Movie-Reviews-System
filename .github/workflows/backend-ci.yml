name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/database/schema.sql"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "db/database/schema.sql"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movie_reviews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_reviews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Testler yalnızca TEST_DATABASE_URL'e bağlanır; DATABASE_URL ve SECRET_KEY sahte.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/movie_reviews_test
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/not_used
      SECRET_KEY: ci-secret-key-only-for-tests-0123456789
      # GOOGLE_API_KEY bilerek yok: testler gerçek Gemini'ye çıkmaz.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Şemayı test veritabanına yükle
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d movie_reviews_test
          -v ON_ERROR_STOP=1 -q -f db/database/schema.sql

      - name: Bağımlılıkları kur
        run: pip install -r backend/requirements.txt

      - name: Ruff
        run: ruff check backend

      - name: Pytest
        run: pytest backend -v --junitxml=pytest-report.xml

      - name: Hiçbir test atlanmamış olmalı (entegrasyon testleri dahil)
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              sys.exit("Atlanan test var ya da hiç test çalışmadı; TEST_DATABASE_URL'i kontrol et.")
          EOF
