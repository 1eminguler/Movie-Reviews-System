name: Frontend Pages

# Frontend'i demo modunda (tarayıcı içi örnek veri) derleyip GitHub Pages'e yayınlar:
# https://1eminguler.github.io/Movie-Reviews-System/
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  build:
    # Yayını yalnızca depo sahibinin tetiklediği çalışmalar yapar; diğer katkıcıların push'ları atlanır
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Demo modunda derle
        run: npm run build
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE_PATH: /Movie-Reviews-System/

      # Doğrudan açılan alt sayfalar (ör. /movies/34) için Pages 404.html'i sunar; uygulama yolu kendisi çözer
      - name: Alt sayfa yenilemesi için 404.html
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
